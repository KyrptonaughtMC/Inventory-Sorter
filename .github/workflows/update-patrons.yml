name: Update Supporters List

on:
  push:
    branches:
      - main
  schedule:
    - cron: '9 0 * * *' # Every day at 00:09 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH_NAME: "update/patrons"
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  update-readme:
    runs-on: meza-ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update supporters list
        uses: meza/action-patrons@v1.0.14
        with:
          files-to-update: |
            - README.md
            - docs/docs/01-inventory-sorter.md

